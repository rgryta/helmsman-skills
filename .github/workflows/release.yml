name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - cli/**

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          python3 - <<'EOF'
          import json, os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          found = {
              "plugin/.claude-plugin/plugin.json": json.load(open("plugin/.claude-plugin/plugin.json"))["version"],
              "plugin/.codex-plugin/plugin.json": json.load(open("plugin/.codex-plugin/plugin.json"))["version"],
              "cli/Cargo.toml": tomllib.load(open("cli/Cargo.toml", "rb"))["package"]["version"],
          }
          bad = {f: v for f, v in found.items() if v != tag}
          if bad:
              sys.exit(f"tag v{tag} does not match {bad}")
          EOF

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: enable long git paths (windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: cargo build
        run: cargo build --release --locked --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          NAME="helmsman-$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml)-${{ matrix.target }}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          mkdir dist
          cd cli/target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$GITHUB_WORKSPACE/dist/$NAME.zip" helmsman.exe
          else
            tar -czf "$GITHUB_WORKSPACE/dist/$NAME.tar.gz" helmsman
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

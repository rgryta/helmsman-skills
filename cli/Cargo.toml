[package]
name = "helmsman"
version = "0.5.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
aho-corasick = "1.1.5"
fancy-regex = "0.13"
memchr = "2.7"
rayon = "1.12.0"
regex = "1.13.1"
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.17.3" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.17.3" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.17.3" }
serde_json = "1"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
lto = true
codegen-units = 1
strip = true

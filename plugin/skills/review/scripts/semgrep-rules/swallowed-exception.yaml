rules:
  - id: swallowed-exception
    languages: [python]
    severity: INFO
    # under 120 chars: _render truncates the message and would cut the hatch
    message: "broad except discards the error with no log or signal; if failing open is deliberate, mark the try: line # nosemgrep"
    patterns:
      # bare `except:` is deliberately absent - ruff E722 already reports it and
      # duplicating it would double-report the same line
      - pattern-either:
          - pattern: |
              try:
                  ...
              except $EXC:
                  pass
          - pattern: |
              try:
                  ...
              except $EXC as $E:
                  pass
          - pattern: |
              try:
                  ...
              except $EXC:
                  return None
          - pattern: |
              try:
                  ...
              except $EXC as $E:
                  return None
          - pattern: |
              try:
                  ...
              except $EXC:
                  return
          - pattern: |
              try:
                  ...
              except $EXC as $E:
                  return
          - pattern: |
              try:
                  ...
              except $EXC:
                  continue
          - pattern: |
              try:
                  ...
              except $EXC as $E:
                  continue
      - metavariable-regex:
          metavariable: $EXC
          regex: ^(Exception|BaseException)$

rules:
  - id: broad-except-around-guard
    languages: [python]
    severity: WARNING
    message: broad except swallows a guard/enforcement call; a TypeError here silently disables the control
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
                  $F(...)
                  ...
              except $EXC:
                  ...
          - pattern: |
              try:
                  ...
                  $F(...)
                  ...
              except $EXC as $E:
                  ...
      - metavariable-regex:
          metavariable: $EXC
          regex: ^(Exception|BaseException)$
      - metavariable-regex:
          metavariable: $F
          regex: .*(guard|enforce|anonym|redact|mask|verify).*
      - pattern-not: |
          try:
              ...
          except $EXC:
              ...
              raise
      - pattern-not: |
          try:
              ...
          except $EXC:
              ...
              raise $X
      - pattern-not: |
          try:
              ...
          except $EXC:
              ...
              raise $X from $Y
      - pattern-not: |
          try:
              ...
          except $EXC as $E:
              ...
              raise
      - pattern-not: |
          try:
              ...
          except $EXC as $E:
              ...
              raise $X
      - pattern-not: |
          try:
              ...
          except $EXC as $E:
              ...
              raise $X from $Y

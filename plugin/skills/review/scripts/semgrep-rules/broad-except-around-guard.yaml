rules:
  - id: broad-except-around-guard
    languages: [python]
    severity: WARNING
    message: broad except swallows a guard/enforcement call; a TypeError here silently disables the control
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
                  $F(...)
                  ...
              except Exception:
                  ...
          - pattern: |
              try:
                  ...
                  $F(...)
                  ...
              except Exception as $E:
                  ...
          - pattern: |
              try:
                  ...
                  $F(...)
                  ...
              except BaseException:
                  ...
      - metavariable-regex:
          metavariable: $F
          regex: .*(guard|enforce|anonym|redact|mask|verify).*
      - pattern-not: |
          try:
              ...
              $F(...)
              ...
          except Exception:
              ...
              raise
      - pattern-not: |
          try:
              ...
              $F(...)
              ...
          except Exception as $E:
              ...
              raise
      - pattern-not: |
          try:
              ...
              $F(...)
              ...
          except BaseException:
              ...
              raise
